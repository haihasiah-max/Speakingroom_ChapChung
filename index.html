@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1428; --paper:#171D35; --ink:#EEF0F8; --muted:#A4AAC4; --line:#2B3253;
  --accent:#F6A3BB; --accent-ink:#1A1030; --accent-soft:#2D2443;
  --rose:#FF9DB5; --pink:#F07C8A; --blush:#F9B5CA; --hl:#5C2B44;
  --ok:#5FD08F; --warn:#FF9A66; --wm-op:.09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1428; --paper:#171D35; --ink:#EEF0F8; --muted:#A4AAC4; --line:#2B3253;
  --accent:#F6A3BB; --accent-ink:#1A1030; --accent-soft:#2D2443;
  --rose:#FF9DB5; --pink:#F07C8A; --blush:#F9B5CA; --hl:#5C2B44;
  --ok:#5FD08F; --warn:#FF9A66; --wm-op:.09; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.muted{color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.banner{display:block;background:var(--brandbox);border-radius:16px;padding:4px 8px;line-height:0}
.banner img{height:56px;width:auto;max-width:100%}
.brand-sub{display:grid;line-height:1.25}
.brand-sub b{font-family:var(--f-display);font-size:19px;font-weight:800}
.brand-sub small{color:var(--muted);font-size:12.5px}
.nav{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav a{text-decoration:none;color:var(--muted);padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* watermark */
.wm{position:relative;isolation:isolate}
.wm::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--wm-img) center 45%/min(55%,300px) no-repeat;opacity:var(--wm-op)}
body::after{content:"";position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:110px;height:110px;background:var(--wm-img) center/contain no-repeat;opacity:.12;pointer-events:none;z-index:-1}

/* controls */
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 20px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pink{background:var(--pink);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;background:var(--paper);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px}
.toggle[aria-pressed="true"]{color:var(--ink);border-color:var(--pink);background:var(--accent-soft)}
.toggle i{width:26px;height:15px;border-radius:99px;background:var(--line);position:relative;flex:none}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--paper);transition:left .15s}
.toggle[aria-pressed="true"] i{background:var(--pink)}
.toggle[aria-pressed="true"] i::after{left:13px}
.field{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;width:100%}

/* intro */
.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;padding-block:28px 18px}
.intro h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-.01em}
.intro h1 em{font-style:normal;color:var(--rose);background:linear-gradient(transparent 60%,var(--hl) 60%);padding:0 4px}
.intro p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.progress{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:200px}
.progress b{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.progress span{font-size:12px;color:var(--muted)}
.progress .track{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.progress .track i{display:block;height:100%;background:var(--pink)}

/* topic tabs */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding-bottom:18px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:2px;min-width:0}
.tab .rn{font-family:var(--f-display);font-size:13px;font-weight:800;color:var(--rose)}
.tab b{font-family:var(--f-display);font-size:15.5px;line-height:1.2}
.tab small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab[aria-selected="true"] .rn{color:var(--blush)}
.tab[aria-selected="true"] small{color:var(--blush)}
.tab .mini{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.tab .mini i{display:block;height:100%;background:var(--pink)}

.practice{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.col{display:grid;gap:14px;min-width:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h3{font-size:17px;margin-bottom:8px}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.qbtn{width:100%;display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:9px 10px}
.qbtn:hover{background:var(--bg)}
.qbtn .no{font-family:var(--f-display);font-weight:800;color:var(--rose);font-variant-numeric:tabular-nums}
.qbtn .t{font-family:var(--f-read);font-size:15px}
.qbtn .st{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff}
.qbtn.done .st{background:var(--ok);border-color:var(--ok)}
.qbtn[aria-current="true"]{background:var(--accent-soft);border-color:var(--blush)}

.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vw{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13.5px;background:var(--bg)}
.vw b{font-weight:700}
.vw span{color:var(--muted)}
.gtip{font-size:13px;background:var(--accent-soft);border-radius:10px;padding:9px 12px;margin-top:10px}
.gtip b{color:var(--rose)}

.card{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.card-in{display:grid;gap:16px}
.card .qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card .qmeta{font-size:13px;font-weight:700;color:var(--rose);letter-spacing:.03em}
.card .qtext{font-family:var(--f-read);font-size:clamp(21px,2.8vw,27px);font-weight:600;line-height:1.3;text-wrap:balance}
.timer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 14px}
.timer .num{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;min-width:2.6ch}
.timer .track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timer .track i{display:block;height:100%;width:0;background:var(--pink);transition:width .2s linear}
.timer .lab{font-size:12px;color:var(--muted);margin-top:4px}
.timer.over .num{color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.reveal{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.reveal h4{margin:0;font-size:13px;font-family:var(--f-body);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rose)}
.keys{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.keys li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;font-size:14.5px;border-bottom:1px solid var(--line);padding-bottom:6px}
.keys li b{font-weight:700}
.keys li span{color:var(--muted)}
.model{font-family:var(--f-read);font-size:16px;line-height:1.6;background:var(--bg);border-left:3px solid var(--blush);padding:10px 14px;border-radius:0 10px 10px 0;margin:0}
.model mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:3px}
.are{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.are div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12.5px;min-width:0}
.are b{display:block;font-family:var(--f-display);font-size:14px;color:var(--rose)}
.next-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* exam */
.exam{padding-top:24px;display:grid;gap:18px}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,36px)}
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
.setup h1{font-size:clamp(26px,3.6vw,38px);font-weight:800}
.setup p{color:var(--muted);margin:8px 0 0}
.rules{display:grid;gap:10px;margin:18px 0 0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:start;font-size:14px}
.rules b.pt{font-family:var(--f-display);font-size:14px;background:var(--accent-soft);color:var(--rose);border-radius:8px;text-align:center;padding:3px 0;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:10px;margin-top:18px}
.opts .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opts .row > span{font-size:13px;font-weight:600;color:var(--muted);min-width:118px}
.code-in{display:flex;gap:6px}
.code-in input{width:110px;font-variant-numeric:tabular-nums;letter-spacing:.1em;font-weight:700}
.slot{border:2px dashed var(--blush);border-radius:16px;padding:18px;display:grid;gap:12px;align-content:start;background:var(--bg);min-height:300px}
.slot-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slot-h b{font-family:var(--f-display);font-size:16px}
.slot-h .code{font-family:var(--f-display);font-size:14px;color:var(--rose);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.reel{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:baseline}
.reel > b{font-family:var(--f-display);font-size:13px;color:var(--rose)}
.reel .v{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.3}
.reel .v small{display:block;font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted)}
.reel.spin .v{color:var(--muted)}
.paper{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:q}
.paper li{display:grid;grid-template-columns:2em minmax(0,1fr);gap:6px;font-family:var(--f-read);font-size:14.5px;filter:blur(4px);user-select:none}
.paper.show li{filter:none;user-select:auto}
.paper li::before{counter-increment:q;content:counter(q);font-family:var(--f-display);font-weight:800;color:var(--rose)}
.paper li.sep{border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
.slot-hint{color:var(--muted);font-size:13px;text-align:center}
.setup-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

.bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:26px;height:6px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--pink)}
.dots i.now{background:var(--ink)}
.dots i.gap{width:8px;background:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qstage{display:grid;gap:20px;min-height:380px;align-content:center;justify-items:center;text-align:center;padding-block:10px}
.qstage .meta{font-size:13px;font-weight:700;color:var(--rose);letter-spacing:.04em}
.qstage .topic{font-family:var(--f-display);font-size:15px;color:var(--muted)}
.qstage .qtext{font-family:var(--f-read);font-size:clamp(23px,3.6vw,34px);font-weight:600;line-height:1.3;max-width:26ch;text-wrap:balance}
.ring{position:relative;width:min(170px,50vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--line);stroke-width:9}
.ring .fgc{fill:none;stroke:var(--pink);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring.prep .fgc{stroke:var(--blush)}
.ring.over .fgc{stroke:var(--warn)}
.ring .rd{position:absolute;inset:0;display:grid;place-content:center;gap:0}
.ring .rd b{font-family:var(--f-display);font-size:clamp(36px,7vw,48px);line-height:1;font-variant-numeric:tabular-nums}
.ring .rd span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rose)}
.qnav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.kbd{font-size:12px;color:var(--muted)}
.kbd kbd{font:inherit;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}

.done-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.done-head h2{font-size:28px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--bg);border-radius:12px;padding:10px 14px;min-width:130px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.rv{display:grid;gap:8px;margin-top:18px}
.rv details{border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.rv summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px}
.rv summary::-webkit-details-marker{display:none}
.rv .no{font-family:var(--f-display);font-weight:800;color:var(--rose)}
.rv .t{font-family:var(--f-read);font-size:15px}
.rv .t small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.short{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.long{background:var(--accent-soft);color:var(--rose)}
.rv .body{padding:0 14px 14px 14px;display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:40}

@media (max-width:980px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  .practice,.setup{grid-template-columns:minmax(0,1fr)}

}
@media (max-width:520px){
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .keys li{grid-template-columns:minmax(0,1fr)}

  .kbd{display:none}
  .qstage{min-height:320px}
  .progress{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function startPractice(T,id){
  if(pt.running){stopTick();pt.running=false;$("#go").textContent="Bắt đầu nói";$("#plab").textContent="Đã dừng";return}
  const L=S.ansTime;let t0=Date.now();pt.running=true;$("#go").textContent="Dừng";
  const box=$("#ptimer");box.classList.remove("over");
  const upd=()=>{const el=(Date.now()-t0)/1000;const left=Math.max(0,L-el);
    $("#pnum").textContent=Math.ceil(left)+"s";$("#pbar").style.width=Math.min(100,el/L*100)+"%";
    $("#plab").textContent=el<10?"Đang nói… (mục tiêu 15–20 giây)":el<15?"Thêm một lý do hoặc ví dụ":"Tốt, kết thúc câu trả lời";
    if(left<=0){stopTick();pt.running=false;box.classList.add("over");$("#pnum").textContent="0s";$("#plab").textContent="Hết giờ. Mở câu mẫu để so sánh.";$("#go").textContent="Nói lại";
      if(!done.has(id)){done.add(id);store.set("done",[...done]);const m=$("#mark");if(m)m.textContent="✓ Đã luyện";const p=$("#pDone");if(p)p.textContent=done.size}}};
  stopTick();tick=setInterval(upd,200);upd();
}

/* ---------- EXAM ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickN(r,arr,n){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function buildPaper(code){
  const r=rng(code*2654435761);
  const core=TOPICS.filter(t=>t.core),other=TOPICS.filter(t=>!t.core);
  const A=core[Math.floor(r()*core.length)],B=other[Math.floor(r()*other.length)];
  const fromTopic=(T,n)=>{const idx=[0,...pickN(r,T.qs.map((_,i)=>i).slice(1),n-1)].sort((x,y)=>x-y);return idx.map(i=>({t:T,i,q:T.qs[i]}))};
  return {code,A,B,qs:[...fromTopic(A,5),...fromTopic(B,3)]};
}

      <button class="toggle" id="tgTts" type="button" aria-pressed="${S.tts}"><i></i>Đọc to câu hỏi</button>
      <button class="toggle" id="tgAuto" type="button" aria-pressed="${S.auto}"><i></i>Tự chuyển câu khi hết giờ</button></div>
     <div class="row"><span>Làm đề theo mã</span><div class="code-in"><input class="field" id="codeIn" inputmode="numeric" maxlength="4" placeholder="VD 4821" aria-label="Mã đề 4 chữ số"><button class="btn ghost sm" id="codeGo" type="button">Mở đề</button></div></div>
    </div></div>
   <div class="slot" id="slot">
    <div class="slot-h"><b>Đề thi</b><span class="code" id="codeLbl">${p?"MÃ ĐỀ "+p.code:"CHƯA QUAY"}</span></div>
    <div class="reel" id="rA"><b>5 câu</b><div class="v">${p?`${p.A.en}<small>${p.A.vi}</small>`:"—"}</div></div>
    <div class="reel" id="rB"><b>3 câu</b><div class="v">${p?`${p.B.en}<small>${p.B.vi}</small>`:"—"}</div></div>
    ${p?`<ol class="paper" id="paperList">${p.qs.map((x,k)=>`<li class="${k===5?"sep":""}">${esc(x.q[0])}</li>`).join("")}</ol>
      <button class="btn ghost sm" id="peek" type="button">Hiện câu hỏi (dành cho giáo viên)</button>`
     :`<p class="slot-hint">Bấm “Quay đề” để lấy ngẫu nhiên một đề 8 câu. Câu hỏi được che đến khi vào thi.</p>`}
    <div class="setup-act">
      <button class="btn ghost" id="spin" type="button">${p?"Quay đề khác":"Quay đề"}</button>
      <button class="btn pink" id="start" type="button" ${p?"":"disabled"}>Bắt đầu thi →</button>
    </div>
   </div></div></div></section>`;
  document.querySelectorAll("#segT button").forEach(b=>b.onclick=()=>{S.ansTime=+b.dataset.s;store.set("ansTime",S.ansTime);renderSetup()});
  $("#tgTts").onclick=()=>{S.tts=!S.tts;store.set("tts",S.tts);renderSetup()};
  $("#tgAuto").onclick=()=>{S.auto=!S.auto;store.set("auto",S.auto);renderSetup()};
  $("#spin").onclick=spin;
  $("#codeGo").onclick=()=>{const v=+$("#codeIn").value;if(!(v>=1000&&v<=9999)){toast("Mã đề gồm 4 chữ số, từ 1000 đến 9999");return}E.paper=buildPaper(v);renderSetup();toast("Đã mở đề "+v)};
  $("#codeIn").onkeydown=e=>{if(e.key==="Enter")$("#codeGo").click()};
  const pk=$("#peek");if(pk)pk.onclick=()=>{const l=$("#paperList");l.classList.toggle("show");pk.textContent=l.classList.contains("show")?"Che câu hỏi":"Hiện câu hỏi (dành cho giáo viên)"};
  $("#start").onclick=()=>{E.phase="run";E.cur=0;E.used=[];renderExam()};
}
function spin(){
  if(E.spinning)return;E.spinning=true;
  const code=newCode();const target=buildPaper(code);
  const core=TOPICS.filter(t=>t.core),other=TOPICS.filter(t=>!t.core);
  $("#spin").disabled=true;$("#start").disabled=true;
  const rA=$("#rA"),rB=$("#rB");rA.classList.add("spin");rB.classList.add("spin");
  let n=0;const steps=16;const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const iv=setInterval(()=>{n++;
    const a=core[n%core.length],b=other[n%other.length];
    rA.querySelector(".v").innerHTML=`${a.en}<small>${a.vi}</small>`;
    if(n<steps-4)rB.querySelector(".v").innerHTML=`${b.en}<small>${b.vi}</small>`;
    $("#codeLbl").textContent="MÃ ĐỀ "+(1000+Math.floor(Math.random()*9000));
    if(n>=steps||reduce){clearInterval(iv);E.paper=target;E.spinning=false;renderSetup();toast("Mã đề "+code+": "+target.A.en+" + "+target.B.en)}
  },reduce?0:90);
}
function ringSVG(){return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bgc" cx="60" cy="60" r="52"/><circle class="fgc" id="fgc" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>`}
function renderRun(){
  const p=E.paper,x=p.qs[E.cur];
  $("#app").innerHTML=`<section class="exam"><div class="stage wm">
    <div class="bar-top">
      <div class="dots" aria-label="Tiến độ">${p.qs.map((_,k)=>`${k===5?'<i class="gap"></i>':""}<i class="${k<E.cur?"on":k===E.cur?"now":""}"></i>`).join("")}</div>
      <div class="tools"><span class="kbd">Mã đề ${p.code}</span>
        <button class="btn ghost sm" id="rep" type="button">🔊 Nhắc lại câu hỏi</button>
        <button class="btn ghost sm" id="quit" type="button">Thoát</button></div>
    </div>
    <div class="qstage">
      <div class="meta">CÂU ${E.cur+1} / 8</div>
      <div class="topic">${x.t.rn}. ${x.t.en}</div>
      <div class="qtext">${esc(x.q[0])}</div>
      <div class="ring prep" id="ring">${ringSVG()}<div class="rd"><b id="rnum">${E.prep}</b><span id="rlab">Chuẩn bị</span></div></div>
      <div class="qnav">
        <button class="btn pink" id="nx" type="button">${E.cur===7?"Nộp bài":"Xong, câu tiếp"} →</button>
      </div>
      <div class="kbd">Phím tắt: <kbd>Space</kbd> sang câu tiếp</div>
    </div></div></section>`;
  if(S.tts)speak(x.q[0]);
  $("#rep").onclick=()=>{if(!speak(x.q[0]))toast("Trình duyệt này chưa hỗ trợ đọc câu hỏi")};
  $("#quit").onclick=()=>{E.phase="setup";renderExam()};
  $("#nx").onclick=nextQ;
  const C=326.7,L=S.ansTime;let t0=Date.now(),phase="prep";
  const fg=$("#fgc"),ring=$("#ring"),num=$("#rnum"),lab=$("#rlab");
  E.ansStart=null;
  const upd=()=>{const el=(Date.now()-t0)/1000;
    if(phase==="prep"){const left=E.prep-el;num.textContent=Math.max(1,Math.ceil(left));fg.style.strokeDashoffset=C*(el/E.prep);
      if(left<=0){phase="ans";t0=Date.now();E.ansStart=t0;ring.classList.remove("prep");lab.textContent="Đang trả lời";stopSpeak()}return}
    const left=L-el;
    if(left>0){num.textContent=Math.ceil(left);fg.style.strokeDashoffset=C*(el/L)}
    else{ring.classList.add("over");num.textContent="0";lab.textContent="Hết giờ";fg.style.strokeDashoffset=C;
      if(S.auto&&el>=L+1.2)nextQ()}};
  stopTick();tick=setInterval(upd,150);upd();
}
function nextQ(){
  stopTick();stopSpeak();
  const used=E.ansStart?Math.min((Date.now()-E.ansStart)/1000,S.ansTime):0;
  E.used[E.cur]=Math.round(used);
  if(E.cur<7){E.cur++;renderRun()}else{E.phase="done";renderExam()}
}
function renderDone(){
  const p=E.paper,tot=E.used.reduce((a,b)=>a+(b||0),0);
  const ok=E.used.filter(u=>u>=12).length;
  const pill=u=>u<10?`<span class="pill short">${u}s · hơi ngắn</span>`:u<15?`<span class="pill long">${u}s · thêm ý</span>`:`<span class="pill good">${u}s · đạt</span>`;
  $("#app").innerHTML=`<section class="exam"><div class="stage wm">
    <div class="done-head"><div><div class="eyebrow">Hoàn thành · Mã đề ${p.code}</div><h2>${p.A.en} + ${p.B.en}</h2></div>
      <div class="tools"><button class="btn ghost" id="again" type="button">Làm lại đề này</button><button class="btn pink" id="newp" type="button">Quay đề mới</button></div></div>
    <div class="stats">
      <div class="stat"><b>${Math.floor(tot/60)}:${String(tot%60).padStart(2,"0")}</b><span>Tổng thời gian nói</span></div>
      <div class="stat"><b>${ok}/8</b><span>Câu nói từ 12 giây trở lên</span></div>
      <div class="stat"><b>${Math.round(tot/8)}s</b><span>Trung bình mỗi câu</span></div>
    </div>
    <p class="muted" style="margin:14px 0 0">Thời gian tính từ lúc hết 3 giây chuẩn bị đến khi em bấm sang câu tiếp. Mở từng câu để xem gợi ý từ vựng và câu mẫu, rồi tự nói lại những câu còn ngắn.</p>
    <div class="rv">${p.qs.map((x,k)=>`<details><summary><span class="no">${k+1}</span><span class="t">${esc(x.q[0])}<small>${x.t.rn}. ${x.t.en}</small></span>${pill(E.used[k]||0)}</summary>
      <div class="body"><ul class="keys">${x.q[1].map(kk=>`<li><b>${esc(kk[0])}</b><span>${esc(kk[1])}</span></li>`).join("")}</ul><p class="model">${x.q[2]}</p></div></details>`).join("")}</div>
  </div></section>`;
  $("#again").onclick=()=>{E.phase="run";E.cur=0;E.used=[];renderExam()};
  $("#newp").onclick=()=>{E.paper=null;E.phase="setup";renderExam();setTimeout(spin,50)};
}

/* ---------- routing ---------- */
function route(){
  const h=location.hash.replace("#","");const ex=h==="phong-thi";
  $("#nav-prac").setAttribute("aria-current",ex?"false":"page");
  $("#nav-exam").setAttribute("aria-current",ex?"page":"false");
  if(ex){if(E.phase==="run")E.phase="setup";renderExam()}else renderPractice();
}
addEventListener("hashchange",route);
addEventListener("keydown",e=>{if(e.code==="Space"&&E.phase==="run"&&location.hash==="#phong-thi"&&!/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();nextQ()}});
E.paper=buildPaper(newCode());
route();
</script>

</body></html>
